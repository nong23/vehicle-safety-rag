name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: vsrag
          POSTGRES_PASSWORD: vsrag
          POSTGRES_DB: vsrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsrag -d vsrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache embedding models
        uses: actions/cache@v6
        with:
          path: data/models
          key: embedding-models-v1

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -v
