[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsrag"
version = "0.1.0"
description = "Answers car safety questions from NHTSA complaints and recalls, with citations, and abstains when the evidence is weak."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vsrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src", "evals"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
