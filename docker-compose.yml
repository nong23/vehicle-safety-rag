services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: vsrag
      POSTGRES_PASSWORD: vsrag
      POSTGRES_DB: vsrag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsrag -d vsrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
